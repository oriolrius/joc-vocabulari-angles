# Joc de Vocabulari Anglès<>Català, served by nginx (unprivileged image, read-only file system).
# Image: Dockerfile. Production: https://angles.riusbarbera.family on k5, behind the k5 Nginx Proxy
# Manager (TLS). Stack: git.oriolrius.cat/oriolrius/k5-stack-angles.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Behind a TLS proxy: a redirect must not name http:// or port 8080.
    absolute_redirect off;
    charset utf-8;
    charset_types text/plain application/json application/yaml text/yaml;

    gzip on;
    gzip_types text/css application/javascript application/json application/yaml text/plain;
    gzip_min_length 1024;

    # The deploy job checks the version and the revision here.
    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header X-App-Version "__VERSION__" always;
        add_header X-Site-Revision "__REVISION__" always;
        add_header Cache-Control "no-store" always;
        return 200 "ok __VERSION__ __REVISION__\n";
    }

    # New vocabulary lists must show at once: no cache.
    location / {
        add_header X-App-Version "__VERSION__" always;
        add_header X-Site-Revision "__REVISION__" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;

        # The lists: YAML is not in mime.types.
        location ~ \.ya?ml$ {
            default_type application/yaml;
            add_header X-App-Version "__VERSION__" always;
            add_header X-Site-Revision "__REVISION__" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache" always;
            try_files $uri =404;
        }
    }
}
